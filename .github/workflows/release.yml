name: Plastic preliminary release

on:
  push:
    tags:
      - 'v0.9.3-plastic.1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # latest commit as of 2026-09-12
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Validate release identity
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'serie').version
          if ($version -ne '0.9.3-plastic.1' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and Plastic prerelease package version must match'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test Windows x64
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build Windows x64
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package and checksum
        run: |
          $name = "serie-$env:RELEASE_VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path package, releases | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/serie.exe package/
          Copy-Item LICENSE, README.md, RELEASE_NOTES.md package/
          $zip = "releases/$name.zip"
          Compress-Archive -Path package/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "releases/$name.zip.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plastic-windows-x64
          path: releases/*
          if-no-files-found: error
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plastic-windows-x64
          path: releases
      - name: Create draft prerelease (publication requires operator approval)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: true
          make_latest: 'false'
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            releases/*.zip
            releases/*.zip.sha256
